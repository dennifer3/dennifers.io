<!-- Videos partial — content only (loaded into #app by app.js) -->
<script>
  // If this file is opened/refreshed directly (not through the SPA),
  // redirect to the app shell and restore the same view via the hash.
  if (!window.__spaLive) { location.replace('index.html#/videos'); }
</script>
<section class="section videos-hero">
  <div class="container">
    <div class="section-head">
      <h1><span class="gradient-text">Videos</span></h1>
      <p>Short clips, game moments, world previews, and little scenes worth replaying.</p>
      <div class="videos-summary" aria-label="Video archive summary">
        <span id="videosCount">0</span>
        <span id="videosCountLabel">Clips</span>
      </div>
    </div>

    <div class="downloads-toolbar videos-toolbar" id="videosToolbar" style="display:none">
      <div class="downloads-search videos-search">
        <input type="search" id="videosSearch" placeholder="Search videos..." aria-label="Search videos" />
      </div>
      <div class="downloads-filters videos-filters" id="videosFilters"></div>
    </div>

    <div class="videos-grid" id="videosGrid"></div>

    <div class="empty-state" id="videosEmpty" style="display:none">
      <p>Videos coming soon...</p>
    </div>
  </div>
</section>

<div class="modal video-modal" id="videoModal" aria-hidden="true">
  <div class="modal-backdrop" id="videoModalBackdrop"></div>
  <div class="modal-content video-modal-content">
    <button class="modal-close" id="videoModalClose" aria-label="Close">✕</button>
    <div class="video-player-stage">
      <video id="videoPlayer" preload="metadata" playsinline></video>
    </div>
    <div class="video-player-panel">
      <div class="video-player-info">
        <p class="video-player-kicker">Now Playing</p>
        <h2 id="videoPlayerTitle">Video Clip</h2>
        <p id="videoPlayerDescription">A short clip from the archive.</p>
      </div>
      <div class="video-player-controls">
        <button class="video-player-button" id="videoPlayerToggle" type="button" aria-label="Play video">▶</button>
        <span class="video-player-time" id="videoPlayerCurrent">0:00</span>
        <input class="video-player-seek" id="videoPlayerSeek" type="range" min="0" max="100" value="0" step="0.01" aria-label="Video seek" />
        <span class="video-player-time" id="videoPlayerDuration">0:00</span>
        <a class="video-player-action" id="videoPlayerDownload" href="#" download>Download</a>
        <a class="video-player-action ghost" id="videoPlayerOpen" href="#" target="_blank" rel="noopener noreferrer">Open</a>
      </div>
    </div>
  </div>
</div>
