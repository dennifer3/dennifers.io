<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dennifer · Home</title>
  <meta name="description" content="Dennifer — creating experiences for VRChat, Unity and more. Explore the welcome page and portfolio." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <!-- Animated background canvas -->
  <canvas id="particles" aria-hidden="true"></canvas> 

  <!-- Persistent Navigation -->
  <header class="nav glass">
    <nav class="container nav-inner">
      <a href="#/home" class="logo" data-page="home" aria-label="Dennifer home">
      </a>
      <ul class="nav-links">
        <li><a href="#/home" data-page="home">Home</a></li>
        <li><a href="#/welcome" data-page="welcome">Welcome</a></li>
        <li><a href="#/portfolio" data-page="portfolio">Portfolio</a></li>
        <li><a href="#/commissions" data-page="commissions">VRC Commissions</a></li>
        <li><a href="#/vrchat" data-page="vrchat">VRC Photos</a></li>
        <li><a href="#/videos" data-page="videos">VRC Videos</a></li>
        <li><a href="#/downloads" data-page="downloads">Downloads</a></li>
        <li><a href="#/support" data-page="support">Ko-Fi & Support</a></li>
      </ul>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

<!-- App content mounts here -->
  <main id="app"></main>

  <div class="media-gate" id="mediaGate" aria-hidden="true" aria-live="polite">
    <div class="media-gate-panel">
      <div class="media-gate-orbit" aria-hidden="true">
        <span></span>
      </div>
      <p class="media-gate-kicker" id="mediaGateKicker">Fetching Media</p>
      <h2 id="mediaGateTitle">Loading Pictures</h2>
      <p class="media-gate-detail" id="mediaGateDetail">Please be patient while the gallery warms up.</p>
      <div class="media-gate-bar" aria-hidden="true">
        <span id="mediaGateBar"></span>
      </div>
      <div class="media-gate-meta">
        <span id="mediaGateCount">0 / 0 pictures</span>
        <span id="mediaGateSize">Measuring media</span>
      </div>
    </div>
  </div>

  <button class="page-scroll-cue" id="pageScrollCue" type="button" aria-label="Scroll for more content" aria-hidden="true">
    <span class="page-scroll-cue-text">More</span>
    <span class="page-scroll-cue-arrow">↓</span>
  </button>

  <!-- Home content (kept in shell; loaded by app.js) -->
  <template id="homeContent">
    <section class="section hub-hero">
      <div class="container hub-center">
        <h1 class="hub-title">
          Explore my <span class="gradient-text">worlds</span> &amp; <span class="gradient-text">projects</span>
        </h1>
        <p class="hub-sub">
          Choose where you'd like to go. Learn more about me on the Welcome page,
          or browse my work in the Portfolio.
        </p>
        <div class="hub-actions">
          <a href="#/welcome" class="btn btn-primary" data-page="welcome">
            <span class="hub-btn-icon">👋</span> Welcome
          </a>
          <a href="#/portfolio" class="btn btn-primary" data-page="portfolio">
            <span class="hub-btn-icon">🖼️</span> Portfolio
          </a>
          <a href="#/commissions" class="btn btn-primary" data-page="commissions">
            <span class="hub-btn-icon">🎨</span> Commissions
          </a>
          <a href="#/downloads" class="btn btn-primary" data-page="downloads">
            <span class="hub-btn-icon">🔽</span> Downloads
          </a>
          <a href="#/support" class="btn btn-primary" data-page="support">
            <span class="hub-btn-icon">☕</span> Ko-Fi & Support
          </a>
        </div>
        <div class="featured-showcase reveal" id="featuredShowcase"></div>
      </div>
    </section>
  </template>

  <!-- Music Player (audio-only with visualizer) — persistent -->
  <aside class="music-player" id="musicPlayer">
    <div class="mp-header">
      <span class="mp-disc">♫</span>
      <span class="mp-title-wrap">
        <span class="mp-kicker">Audio Stream</span>
        <span class="mp-title">Loading Track...</span>
      </span>
      <button class="mp-collapse" aria-label="Collapse player">–</button>
    </div>
    <div class="mp-body">
      <canvas class="mp-visualizer"></canvas>
      <div class="mp-status" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="mp-controls">
        <button class="mp-play" aria-label="Play / Pause">▶</button>
        <button class="mp-restart" aria-label="Restart song">⟲</button>
        <span class="mp-time">0:00</span>
      </div>
      <div class="mp-volume-row">
        <span class="mp-volume">10%</span>
        <input type="range" class="mp-volume-slider" aria-label="Volume" min="0" max="100" value="10" />
      </div>
    </div>
  </aside>
  <!-- Hidden YouTube iframe for audio -->
  <div id="musicPlayerFrame" style="width:0;height:0;position:absolute;opacity:0;pointer-events:none" aria-hidden="true"></div>

  <!-- Static project data (generated by: node generate.js) -->
  <script src="projects.js"></script>
  <script src="vrchat-photos.js"></script>

  <!-- Lightbox modal (used by portfolio) -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div class="modal-gallery">
        <button class="gallery-nav prev" id="prevBtn" aria-label="Previous photo">‹</button>
        <div class="gallery-slide" id="gallerySlide">
          <img id="galleryImg" src="" alt="Project photo" />
        </div>
        <button class="gallery-nav next" id="nextBtn" aria-label="Next photo">›</button>
      </div>
      <div class="gallery-counter" id="galleryCounter"></div>
      <h2 id="modalTitle"></h2>
    </div>
  </div>

  <script src="music-player.js"></script>
  <script src="app.js"></script>

  <script>
    // ===== Particle background =====
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }

    function initParticles() {
      const count = prefersReduced ? 35 : 80;
      particles = [];
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 2 + 0.5,
          c: `rgba(127, 90, 240, ${Math.random() * 0.5 + 0.2})`
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.c;
        ctx.fill();
        for (let q of particles) {
          const dx = p.x - q.x, dy = p.y - q.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.strokeStyle = `rgba(127, 90, 240, ${0.12 * (1 - dist / 120)})`;
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      }
      draw();
      requestAnimationFrame(animate);
    }

    resize();
    window.addEventListener('resize', resize);
    if (prefersReduced) draw(); else animate();

    // ===== Mobile nav =====
    const navToggle = document.getElementById('navToggle');
    const navLinks = document.querySelector('.nav-links');
    navToggle.addEventListener('click', () => {
      const open = navLinks.classList.toggle('open');
      navToggle.classList.toggle('active');
      navToggle.setAttribute('aria-expanded', open);
    });
    navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      navLinks.classList.remove('open');
      navToggle.classList.remove('active');
      navToggle.setAttribute('aria-expanded', 'false');
    }));

    // ===== Sticky nav =====
    const header = document.querySelector('.nav');
    window.addEventListener('scroll', () => {
      header.classList.toggle('scrolled', window.scrollY > 10);
    });
  </script>
</body>
</html>
